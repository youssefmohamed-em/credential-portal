
<p-toast position="top-right"></p-toast>
<app-header
  [title]="translation.translate('MACHINES.TITLE')"
  icon="pi-cog"
  [buttons]="headerButtons()">
</app-header>

<div class="
    p-6 min-h-screen

    bg-[#FAF7F0]
    dark:bg-[#080d18]

    transition-colors duration-300
  ">


  <app-shared-table
    [columns]="tableColumns"
    [data]="machines()"
    [menuActions]="tableActions"
    [loading]="loading()"

    [showPagination]="true"

    [emptyMessage]="'NO_MACHINES_FOUND'"
    [totalElements]="totalElements() "
  [pageSize]="pageSize()"
  [currentPage]="currentPage()"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  />

</div>
@if (showCreateModal()) {

  <!-- Overlay -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4"
    (click)="closeCreateModal()">

    <!-- Modal -->
    <div
      class="w-full max-w-md rounded-2xl bg-white shadow-2xl overflow-hidden"
      (click)="$event.stopPropagation()">

      <!-- Header -->
      <div class="flex items-center justify-between px-5 py-4 bg-[#9a7200]">

        <h2 class="text-lg font-semibold text-white">
          Add Machine
        </h2>

        <button
          type="button"
          (click)="closeCreateModal()"
          class="w-8 h-8 flex items-center justify-center rounded-full
                 text-white/80 hover:text-white hover:bg-white/10
                 transition duration-200">
          <i class="pi pi-times text-sm"></i>
        </button>

      </div>

      <!-- Body -->
      <div class="p-5 space-y-5">

        <!-- Code -->
        <div>
          <label for="code" class="block text-sm font-medium text-gray-700 mb-2">
            Machine Code
          </label>
          <input
            #codeInput
            id="code"
            type="text"
            placeholder="e.g. MC-001"
            [class.border-red-500]="formError()"
            class="w-full rounded-lg border border-gray-300
                   bg-transparent px-3 py-2.5
                   text-sm text-black
                   placeholder-gray-400
                   outline-none
                   transition duration-200
                   focus:border-[#9a7200] focus:ring-1 focus:ring-[#9a7200]"
          />
        </div>

        <!-- Location -->
        <div>
          <label for="location" class="block text-sm font-medium text-gray-700 mb-2">
            Location
          </label>
          <input
            #locationInput
            id="location"
            type="text"
            placeholder="e.g. Warehouse A"
            [class.border-red-500]="formError()"
            class="w-full rounded-lg border border-gray-300
                   bg-transparent px-3 py-2.5
                   text-sm text-black
                   placeholder-gray-400
                   outline-none
                   transition duration-200
                   focus:border-[#9a7200] focus:ring-1 focus:ring-[#9a7200]"
          />
        </div>

        <!-- Error message -->
        @if (formError()) {
          <p class="text-xs text-red-500 flex items-center gap-1">
            <i class="pi pi-exclamation-circle text-[10px]"></i>
            {{ formError() }}
          </p>
        }

      </div>

      <!-- Footer -->
      <div class="flex justify-end gap-3 border-t border-gray-100 px-5 py-4 bg-gray-50">

        <button
          type="button"
          (click)="closeCreateModal()"
          class="rounded-lg border border-gray-300 px-4 py-2
                 text-sm font-medium text-gray-700
                 bg-white hover:bg-gray-100
                 transition duration-200">
          Cancel
        </button>

        <button
          type="button"
          (click)="saveMachine(codeInput.value, locationInput.value)"
          [disabled]="loading()"
          class="rounded-lg bg-[#9a7200] px-4 py-2
                 text-sm font-medium text-white
                 hover:bg-[#eab94f]
                 disabled:bg-gray-300 disabled:cursor-not-allowed
                 active:scale-[0.99]
                 shadow-sm
                 transition duration-200">
          @if (loading()) {
            <span class="flex items-center gap-2">
              <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
              Saving...
            </span>
          } @else {
            Save
          }
        </button>

      </div>

    </div>

  </div>

}
