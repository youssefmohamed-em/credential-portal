<header
  class="sticky top-0 z-40
         min-h-16
         bg-white
         border-b border-gray-200
         flex items-center justify-between
         px-4 sm:px-6 lg:px-8
         py-3"
>

  <!-- Page Information -->
  <div class="flex items-center gap-3 min-w-0">

    <!-- Icon -->
    @if (icon) {
      <div
        class="hidden sm:flex
               w-10 h-10
               rounded-lg
               bg-amber-100
               text-amber-600
               items-center justify-center
               shrink-0"
      >
        <i
          class="pi text-lg"
          [class]="icon"
        ></i>
      </div>
    }


    <!-- Title -->
    <div class="min-w-0">

      <h1
        class="text-lg sm:text-xl
               font-bold
               text-gray-900
               truncate"
      >
        {{ title }}
      </h1>


      @if (description) {
        <p
          class="hidden sm:block
                 text-xs
                 text-gray-500
                 truncate"
        >
          {{ description }}
        </p>
      }

    </div>

  </div>


  <!-- Right Side -->
  <div class="flex items-center gap-2 sm:gap-4">

    @if (button) {
    <button
      [type]="button.type ?? 'button'"
      class="flex items-center gap-2
             px-3 sm:px-4
             py-2
             rounded-lg
             bg-amber-400
             text-[#0b1220]
             text-sm
             font-semibold
             hover:bg-amber-500
             focus:outline-none
             focus:ring-2
             focus:ring-amber-300
             transition-all duration-200"
    >

      @if (button.icon) {
        <i
          class="pi"
          [class]="button.icon"
        ></i>
      }

      <span class="hidden sm:inline">
        {{ button.label }}
      </span>

    </button>
  }


  </div>

</header>
