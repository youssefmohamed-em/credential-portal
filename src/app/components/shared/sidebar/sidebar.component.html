<!-- زرار الفتح - Mobile -->



<!-- Overlay - Mobile -->
@if (isOpen()) {
  <div (click)="closeSidebar.emit()" class="fixed inset-0 bg-black/40 dark:bg-black/60 backdrop-blur-sm z-[998] md:hidden"></div>
}



<!-- Sidebar -->
<aside
  class="
    fixed md:sticky
    top-0 right-0
    h-screen

    bg-white dark:bg-[#0b1220]
    text-gray-700 dark:text-gray-300

    border-l border-gray-200 dark:border-transparent

    z-[999]

    transition-all duration-300 ease-in-out

    flex flex-col

    md:translate-x-0
  "

  [class.translate-x-full]="!isOpen()"
  [class.w-64]="!isCollapsed()"
  [class.w-20]="isCollapsed()"
>


  <!-- Logo -->
  <div class="px-4 py-7 flex flex-col items-center gap-2">

    <div
      class="
        w-14 h-14 rounded-full

        bg-gray-50 dark:bg-[#0f1a30]

        border border-amber-500/40

        flex items-center justify-center

        shadow-[0_0_15px_rgba(217,164,65,0.15)]

        shrink-0
      "
    >
      <img
        src="logo.png"
        class="w-8 h-8 object-contain"
        alt="Logo"
      />
    </div>

    <span
      class="
        text-amber-500 dark:text-amber-400
        text-xs font-semibold
        tracking-widest
        transition-all
        whitespace-nowrap
      "
      [class.hidden]="isCollapsed()"
    >
      GOLD ERA
    </span>

  </div>


  <!-- Navigation -->
  <nav class="flex flex-col gap-1 px-3 mt-4">


    <!-- Products -->
    <a
      routerLink="/dashboard/products"
      routerLinkActive="bg-amber-400 text-black font-bold shadow-md"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeSidebar.emit()"
      [title]="isCollapsed() ? 'Products' : ''"

      class="
        flex items-center gap-3
        px-4 py-3
        rounded-lg

        text-gray-700 dark:text-gray-300

        hover:bg-amber-400
        hover:text-black
        hover:font-bold
        hover:shadow-md

        focus:bg-amber-400
        focus:text-black
        focus:font-bold
        focus:shadow-md

        outline-none
        transition-all duration-200
      "

      [class.justify-center]="isCollapsed()"
    >

      <i class="pi pi-box text-base shrink-0"></i>

      <span
        class="text-sm whitespace-nowrap"
        [class.hidden]="isCollapsed()"
      >
        {{ translation.translate('SIDEBAR.PRODUCTS') }}
      </span>

    </a>


    <!-- Registration -->
    <a
      routerLink="/dashboard/registeration"
      routerLinkActive="bg-amber-400 text-black font-bold shadow-md"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeSidebar.emit()"
      [title]="isCollapsed() ? 'Registration' : ''"

      class="
        flex items-center gap-3
        px-4 py-3
        rounded-lg

        text-gray-700 dark:text-gray-300

        hover:bg-amber-400
        hover:text-black
        hover:font-bold
        hover:shadow-md

        focus:bg-amber-400
        focus:text-black
        focus:font-bold
        focus:shadow-md

        outline-none
        transition-all duration-200
      "

      [class.justify-center]="isCollapsed()"
    >

      <i class="pi pi-cog text-base shrink-0"></i>

      <span
        class="text-sm whitespace-nowrap"
        [class.hidden]="isCollapsed()"
      >
        {{ translation.translate('SIDEBAR.MACHINES') }}
      </span>

    </a>

  </nav>


  <!-- Footer -->
  <div
    class="
      mt-auto px-3 pb-3
      flex flex-col gap-1

      border-t
      border-gray-200 dark:border-white/5

      pt-3
    "
  >


    <!-- Logout -->
    <button
      type="button"
      (click)="logout()"
      [title]="isCollapsed() ? 'Log Out' : ''"

      class="
        flex items-center gap-3
        px-4 py-3
        rounded-lg

        text-gray-600 dark:text-gray-300

        hover:bg-red-500/90
        hover:text-white

        focus:bg-red-500/90
        focus:text-white
        focus:outline-none

        transition-all duration-200
      "

      [class.justify-center]="isCollapsed()"
    >

      <i class="pi pi-sign-out text-base shrink-0"></i>

      <span
        class="text-sm whitespace-nowrap"
        [class.hidden]="isCollapsed()"
      >
        {{ translation.translate('SIDEBAR.LOGOUT') }}
      </span>

    </button>


    <!-- Collapse Toggle -->
    <button
      type="button"
      (click)="toggleCollapsed.emit()"

      class="
        hidden md:flex
        items-center gap-3
        px-4 py-3
        rounded-lg

        text-gray-600 dark:text-gray-300

        hover:bg-amber-400
        hover:text-[#0b1220]

        focus:bg-amber-400
        focus:text-[#0b1220]
        focus:outline-none

        transition-all duration-200
      "

      [class.justify-center]="isCollapsed()"
    >

      <i
        class="pi text-sm shrink-0"
        [class.pi-angle-right]="!isCollapsed()"
        [class.pi-angle-left]="isCollapsed()"
      ></i>

      <span
        class="text-sm whitespace-nowrap"
        [class.hidden]="isCollapsed()"
      >
        {{ translation.translate('SIDEBAR.COLLAPSE') }}
      </span>

    </button>

  </div>

</aside>
