<header
  class="h-16 bg-white border-b border-gray-200
         flex items-center justify-between
         gap-4
         px-4 sm:px-8
         sticky top-0 z-40"
>

  <!-- Left: Sidebar toggle (mobile) + Page Title -->
  <div class="flex items-center gap-3">
    <button
      type="button"
      class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors"
    >
      <i class="pi pi-bars text-lg"></i>
    </button>

    <h1 class="hidden md:block text-lg font-semibold text-gray-800">
      لوحة التحكم
    </h1>
  </div>


  <!-- Center: Search -->
  <div class="flex-1 max-w-md hidden sm:block">
    <div class="relative">
      <i class="pi pi-search absolute top-1/2 -translate-y-1/2 right-4 text-gray-400 text-sm"></i>
      <input
        type="text"
        placeholder="البحث في الأصول والمعاملات..."
        class="w-full bg-gray-100 text-gray-700 text-sm
               rounded-full
               pr-11 pl-4 py-2.5
               border border-transparent
               focus:outline-none focus:border-amber-400 focus:bg-white
               transition-colors"
      />
    </div>
  </div>


  <!-- Right Side -->
 <!-- Right Side -->
<div class="flex items-center gap-2 sm:gap-4">

  <!-- Language -->
  <button
    type="button"
    (click)="toggleLanguage()"
    class="w-9 h-9
           flex items-center justify-center
           rounded-lg
           text-gray-500
           hover:text-[#9a7200]
           hover:bg-yellow-50
           focus:outline-none
           transition-all duration-200"
    [title]="
      translation.lang() === 'ar'
        ? 'English'
        : 'العربية'
    "
  >
    <i class="pi pi-language text-lg"></i>
  </button>


  <!-- Mobile search icon -->
  <button
    type="button"
    class="sm:hidden p-2 rounded-lg
           text-gray-600
           hover:bg-gray-100
           transition-colors"
  >
    <i class="pi pi-search text-lg"></i>
  </button>


  <!-- Notifications -->
  <button
    type="button"
    class="relative p-2 rounded-lg
           text-gray-600
           hover:bg-gray-100
           transition-colors"
  >
    <i class="pi pi-bell text-lg"></i>

    <span
      class="absolute top-1.5 right-1.5
             w-2 h-2
             bg-amber-500 rounded-full
             ring-2 ring-white"
    ></span>
  </button>


  <!-- Divider -->
  <div class="hidden sm:block w-px h-8 bg-gray-200"></div>


  <!-- User -->
  <div class="flex items-center gap-2.5 cursor-pointer">

    <div class="hidden sm:block text-right">

      <p class="text-sm font-medium text-gray-800">
        أحمد محمد
      </p>

      <p class="text-xs text-gray-400">
        حساب ذهبي
      </p>

    </div>


    <div
      class="w-9 h-9 rounded-full
             bg-gradient-to-br from-amber-400 to-amber-600
             text-[#0b1220]
             flex items-center justify-center
             font-semibold text-sm
             ring-2 ring-amber-200"
    >
      <i class="pi pi-user"></i>
    </div>

  </div>

</div>

</header>
